<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Créer un compte — UQZ</title><link rel="icon" type="image/svg+xml" href="./assets/uq-logo.jpg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./site.css"><style>
.wiz{max-width:560px;margin:0 auto;padding:64px 32px}
.wiz-steps{display:flex;gap:6px;margin-bottom:30px}
.wiz-dot{flex:1;height:4px;border-radius:2px;background:var(--line2);transition:.3s}
.wiz-dot.on{background:var(--blue)}
.wiz-dot.done{background:var(--teal)}
.wiz-card{padding:36px;border-radius:18px;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--line)}
.wiz-card h1{font-size:1.6rem;margin-bottom:6px}
.wiz-guide{color:var(--dim);font-size:.9rem;margin-bottom:26px}
.wiz label{display:block;font-size:.82rem;font-weight:500;color:var(--dim);margin:16px 0 7px}
.wiz input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:11px;padding:13px 15px;color:#fff;font-size:16px;font-family:inherit;outline:none;transition:border-color .2s}
.wiz input:focus{border-color:var(--blue)}
.wiz-err{color:#ff9d97;font-size:.85rem;margin-top:10px;min-height:20px}
.wiz-nav{display:flex;justify-content:space-between;margin-top:26px;gap:12px}
.wiz-nav .btn{flex:1}
.defi-box{padding:20px;border-radius:14px;background:rgba(0,120,212,.08);border:1px solid rgba(0,120,212,.25);margin:18px 0;text-align:center}
.defi-objets{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.defi-objets span{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line2);font-weight:700;font-size:1.1rem}
.ok-box{text-align:center;padding:40px 20px}
.ok-box .big{font-size:3rem;margin-bottom:14px}
</style></head><body><header class="hd" id="hd">
  <a class="logo" href="./index.html"><img src="./assets/uq-logo.jpg" alt="UQZ"> UQZ</a>
  <nav class="nav"><ul>
    <li><a href="./index.html">Accueil</a></li>
    <li><a href="./zando.html">Zando</a></li>
    <li><a href="./borb.html">Wallet</a></li>
    <li><a href="./chat.html">Chat &amp; Mail</a></li>
    <li><a href="./studio.html">Studio</a></li>
  </ul></nav>
  <a class="hd-cta" href="./contact.html">Créer un compte</a>
  <button class="burger" onclick="uqMenu(this)" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="menu"><ul>
    <li><a href="./index.html">Accueil</a></li><li><a href="./zando.html">Zando</a></li>
    <li><a href="./borb.html">UQ Wallet</a></li><li><a href="./auth.html">UQ Auth</a></li>
    <li><a href="./chat.html">UQ Chat &amp; Mail</a></li><li><a href="./studio.html">UQ Studio</a></li>
    <li><a href="./trading.html">UQ Trading</a></li><li><a href="./contact.html">Contact</a></li>
  </ul></div>
</header>
<div class="page"><div class="wiz" id="wiz">
  <div class="wiz-steps" id="steps"></div>
  <div class="wiz-card" id="card"><p style="color:var(--dim)">Chargement…</p></div>
</div></div>
<footer><div class="fcols"><div class="fbrand"><a class="logo" href="./index.html"><img src="./assets/uq-logo.jpg" alt="UQZ"> UQZ</a><p>Ufundi Quotidienne Zando — l'écosystème UQ qui connecte l'Afrique.</p></div></div><div class="fbot"><span>© 2026 UQZ</span></div></footer>
<script type="module">
import { UQAuth, CHAMPS_CREATION } from './assets/uq-auth.js';
UQAuth.configurer({ apiUrl:'https://api.uqplatform.com' });
const card=document.getElementById('card'),steps=document.getElementById('steps');
const donnees={};let etape=0;
steps.innerHTML=CHAMPS_CREATION.map(()=>'<div class="wiz-dot"></div>').join('');
const dots=[...steps.children];
function paint(){dots.forEach((d,i)=>{d.className='wiz-dot'+(i<etape?' done':i===etape?' on':'')})}
function renderEtape(){
  const e=CHAMPS_CREATION[etape];paint();
  card.innerHTML='<h1>'+e.titre+'</h1><p class="wiz-guide">'+(e.guide||'')+'</p><form id="f">'+
   e.champs.filter(c=>c.type!=='human').map(c=>{
     const lab=c.label+(c.requis?' *':'');
     const inp=c.type==='password'?'<input name="'+c.nom+'" type="password" '+(c.requis?'required':'')+' autocomplete="new-password">'
       :c.type==='email'?'<input name="'+c.nom+'" type="email" '+(c.requis?'required':'')+'>'
       :c.type==='date'?'<input name="'+c.nom+'" type="date" '+(c.requis?'required':'')+'>'
       :c.type==='tel'?'<input name="'+c.nom+'" type="tel">'
       :'<input name="'+c.nom+'" type="text" '+(c.requis?'required':'')+' '+(c.aide?'placeholder="'+c.aide+'"':'')+'>';
     return '<label>'+lab+'</label>'+inp}).join('')+
   '<div class="wiz-err" id="err"></div>'+
   '<div class="wiz-nav"><button type="button" class="btn btn-ghost" id="back" '+(etape===0?'disabled style="opacity:.4"':'')+'>← Retour</button>'+
   '<button type="submit" class="btn btn-p">'+(etape===CHAMPS_CREATION.length-1?'Créer mon compte':'Suivant →')+'</button></div></form>';
  document.getElementById('back').onclick=()=>{if(etape>0){etape--;renderEtape()}};
  document.getElementById('f').onsubmit=async(ev)=>{
    ev.preventDefault();const fd=new FormData(ev.target),v={};
    for(const [k,x] of fd.entries())v[k]=x;
    if(etape===3&&v.password!==v.password2){document.getElementById('err').textContent='Les mots de passe ne correspondent pas';return}
    Object.assign(donnees,v);delete donnees.password2;
    if(etape===CHAMPS_CREATION.length-2){await etapeDefi()}else{etape++;renderEtape()}
  };
}
async function etapeDefi(){
  etape=CHAMPS_CREATION.length-1;paint();
  card.innerHTML='<h1>Vérification humaine</h1><p class="wiz-guide">Un dernier test pour prouver que tu es humain.</p><div class="defi-box" id="defiBox">Chargement du défi…</div><div class="wiz-err" id="err"></div><div class="wiz-nav"><button type="button" class="btn btn-ghost" id="back">← Retour</button><button class="btn btn-p" id="verify" disabled>Valider</button></div>';
  document.getElementById('back').onclick=()=>{etape=3;renderEtape()};
  try{
    const begin=await UQAuth.defiHumainCommencer();
    const jeton=begin.jeton||begin.defi||begin.id;
    const box=document.getElementById('defiBox');
    if(begin.mode==='scene'&&begin.objets){
      box.innerHTML='<p style="font-size:.9rem;color:var(--dim);margin-bottom:6px">Scène : identifie le numéro de l\'objet ciblé</p>'+
        '<div class="defi-objets">'+begin.objets.map((n,i)=>'<span>'+n+'</span>').join('')+'</div>'+
        '<input id="rep" type="text" inputmode="numeric" placeholder="Numéro de l\'objet" style="max-width:200px;margin:10px auto;display:block">';
    }else{
      box.innerHTML='<p style="font-size:.9rem;color:var(--dim)">Défi reçu — entre ta réponse :</p><input id="rep" type="text" placeholder="Réponse" style="max-width:200px;margin:10px auto;display:block">';
    }
    document.getElementById('verify').disabled=false;
    document.getElementById('verify').onclick=async()=>{
      const rep=document.getElementById('rep').value;
      if(!rep){document.getElementById('err').textContent='Entre une réponse';return}
      const btn=document.getElementById('verify');btn.disabled=true;btn.textContent='Vérification…';
      try{
        const pass=await UQAuth.defiHumainVerifier(jeton,begin.mode==='scene'?parseInt(rep):rep);
        btn.textContent='Création du compte…';
        const res=await UQAuth.creerCompte(donnees,pass);
        card.innerHTML='<div class="ok-box"><div class="big">&#10003;</div><h1>Compte créé !</h1><p class="wiz-guide">Ton identité UQ est prête'+(res.numero||res.uq||res.id?' — '+(res.numero||res.uq||res.id):'')+'.</p><a class="btn btn-p" href="./index.html">Retour à l\'accueil</a></div>';
      }catch(e){btn.disabled=false;btn.textContent='Valider';document.getElementById('err').textContent=e.message||'Échec — réessaie'}
    };
  }catch(e){
    document.getElementById('defiBox').innerHTML='<p style="color:#ff9d97;font-size:.9rem">Défi indisponible : '+(e.message||'erreur')+'. Réessaie ou écris à contact@uqplatform.com</p>';
  }
}
renderEtape();
</script>
<script>const hd=document.getElementById('hd');addEventListener('scroll',()=>hd&&hd.classList.toggle('sc',scrollY>40),{passive:true});
function uqMenu(b){const m=document.querySelector('.menu');if(m){m.classList.toggle('on');b.setAttribute('aria-expanded',m.classList.contains('on'))}}
document.addEventListener('click',e=>{const m=document.querySelector('.menu'),b=document.querySelector('.burger');if(m&&m.classList.contains('on')&&!m.contains(e.target)&&!b.contains(e.target))m.classList.remove('on')});</script>
<script src="./theme.js" defer></script>
</body></html>
