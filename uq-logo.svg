<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dégradés Microsoft -->
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/><stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd668"/><stop offset="1" stop-color="#107C10"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4dd8e6"/><stop offset="1" stop-color="#00B7C3"/>
    </linearGradient>
    <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ec2"/><stop offset="1" stop-color="#E3008C"/>
    </linearGradient>
    <!-- Verre : reflet + ombre portée -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Tuile glass arrondie -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0b0d14" stroke="rgba(255,255,255,.14)"/>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#glass)"/>
  <!-- Reflet diagonal -->
  <path d="M10 14 Q32 4 54 14 L54 22 Q32 12 10 22 Z" fill="#ffffff" opacity=".10"/>

  <!-- Quatre barres de couleur (UQ stylisé) -->
  <g filter="url(#glow)">
    <!-- U : hampe gauche bleu, courbe teal, hampe droite vert -->
    <rect x="12" y="17" width="5.5" height="30" rx="2.75" fill="url(#gBlue)"/>
    <path d="M17.5 24 Q24 19 30.5 24 L30.5 35 Q24 40 17.5 35 Z" fill="url(#gTeal)" opacity=".95"/>
    <rect x="30.5" y="17" width="5.5" height="30" rx="2.75" fill="url(#gGreen)"/>
    <!-- Q : anneau rose -->
    <circle cx="43" cy="31" r="9.5" fill="none" stroke="url(#gPink)" stroke-width="5.5"/>
    <rect x="48" y="34" width="7" height="4.5" rx="2.2" fill="url(#gPink)" transform="rotate(45 48 34)"/>
  </g>

  <!-- Liseré lumineux bas -->
  <rect x="8" y="52" width="48" height="1.6" rx=".8" fill="#ffffff" opacity=".28"/>
</svg>
